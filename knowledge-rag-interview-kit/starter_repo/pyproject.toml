[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-knowledge-rag-studio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2.0",
  "asyncpg",
  "redis",
  "httpx",
  "pypdf>=5",
  "python-multipart>=0.0.18",
  "elasticsearch[async]>=9.5,<10", # retriever + semantic_text API，与 ES 9.5.x 对齐
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
  "sqlalchemy",
]
graph = [
  "neo4j>=5.28,<7",
]
agent = [
  "openai-agents",
  "langgraph",
  "mcp",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "labs*"]

[tool.setuptools.package-data]
app = ["static/*.html", "static/*.css", "static/*.js"]
