n would you fine-tune, and when not?", "a_en": "<p>Fine-tune for <strong>behavior<\/strong>: a consistent output format, a domain style, better tool-calling on <em>your<\/em> tools, or distilling a big model's behavior into a small, cheap one. Don't fine-tune to add <strong>facts<\/strong> that change: use RAG, since fine-tuned facts are hard to update, hard to cite and can't be access-controlled. Start with prompting, then RAG, and fine-tune only when the evaluation shows a gap they can't close.<\/p>", "q_zh": "什么时候该微调，什么时候不该？", "a_zh": "<p>为<strong>行为<\/strong>而微调：一致的输出格式、领域风格、更好地调用<strong>你自己的<\/strong>工具，或把大模型的行为蒸馏到小而便宜的模型上。不要为了加入会变化的<strong>事实<\/strong>而微调：用 RAG，因为微调进去的事实难更新、难引用，也无法做访问控制。先 prompt，再 RAG，只有评估显示前两者无法弥补差距时才微调。<\/p>"}, {"id": "L9", "section": "L", "star": false, "q_en": "How would you fine-tune a small model to call your tools better?", "a_en": "<p>Collect successful trajectories from traces (with PII removed), plus corrected failures. Format them as the model's native tool-call format. Fine-tune with LoRA. Evaluate on a <strong>held-out<\/strong> set and on your adversarial suite, because fine-tuning can erase safety behavior. Watch for catastrophic forgetting of general skills. Compare against simply using a stronger model, since the cheapest fix is often a better base model.<\/p>", "q_zh": "你会如何微调一个小模型，让它更好地调用你的工具？", "a_zh": "<p>从 trace 中收集成功的轨迹（去除个人信息），再加上被纠正过的失败案例。按模型原生的工具调用格式整理。用 LoRA 微调。在<strong>留出集<\/strong>和对抗套件上评估，因为微调可能抹掉安全行为。注意灾难性遗忘。并与“直接换更强的模型”比较，最便宜的解法往往是更好的基座模型。<\/p>"}, {"id": "L10", "section": "L", "star": true, "q_en": "What determines LLM latency?", "a_en": "<p>Two phases. <strong>Prefill<\/strong> processes the whole prompt in parallel; it's compute-bound and sets <strong>time to first token (TTFT)<\/strong>. <strong>Decode<\/strong> generates one token at a time; it's memory-bandwidth-bound (each step reads the weights and the KV cache) and sets <strong>time per output token<\/strong>. So long prompts hurt TTFT, and long answers hurt total time. For agents, many model calls multiply both, which is why step count, output length and prompt caching matter.<\/p>", "q_zh": "什么决定了 LLM 的延迟？", "a_zh": "<p>两个阶段。<strong>Prefill<\/strong> 并行处理整个 prompt，是计算密集型的，决定<strong>首 token 延迟（TTFT）<\/strong>。<strong>Decode<\/strong> 一次生成一个 token，是内存带宽密集型的（每一步都要读取权重和 KV cache），决定<strong>每个输出 token 的时间<\/strong>。所以长 prompt 影响 TTFT，长回答影响总时间。Agent 的多次模型调用会把两者成倍放大，所以步数、输出长度和 prompt caching 很重要。<\/p>"}, {"id": "L11", "section": "L", "star": false, "q_en": "What do continuous batching, PagedAttention, quantization and speculative decoding each buy you?", "a_en": "<p><em>Continuous batching<\/em> adds and removes requests from the GPU batch every step, for much higher throughput. <em>PagedAttention<\/em> (vLLM) stores the KV cache in pages like virtual memory, so less memory is wasted and more requests fit. <em>Quantization<\/em> (int8, int4, FP8) gives smaller and faster models, sometimes at a quality cost, so evaluate it. <em>Speculative decoding<\/em> has a small draft model propose several tokens that the big model verifies in one pass, giving lower latency with the same output distribution.<\/p>", "q_zh": "连续批处理、PagedAttention、量化和投机解码各带来什么？", "a_zh": "<p><em>连续批处理*每一步都把请求加入或移出 GPU 批次，吞吐量大幅提高。*PagedAttention<\/em>（vLLM）像虚拟内存一样按页存放 KV cache，浪费更少、能容纳更多请求。<em>量化<\/em>（int8、int4、FP8）让模型更小更快，有时有质量损失，需要评估。*投机解码*让一个小的草稿模型先提出若干 token，由大模型一次验证，延迟更低且输出分布不变。<\/p>"}, {"id": "L12", "section": "L", "star": false, "q_en": "How would you serve an agent product to 1,000 concurrent users?", "a_en": "<p>Separate model serving from the agent runtime. Use a model gateway with routing (a small model for routing and extraction, a big one for planning), per-tenant quotas and rate limits, prompt caching, retries with backoff, and fallbacks across providers. Run the agents as queued, stateless workers with durable checkpoints (like Lab 12). Autoscale on queue depth and GPU utilization. Stream partial progress to users. Track cost per <em>successful task<\/em>, not per call.<\/p>", "q_zh": "你会如何为 1,000 个并发用户提供 Agent 服务？", "a_zh": "<p>把模型服务与 Agent runtime 分开。使用带路由的模型网关（小模型做路由和抽取，大模型做规划），按租户配额和限流，prompt caching，带退避的重试，以及跨厂商的降级。把 Agent 作为排队的无状态 worker 运行，并有持久化 checkpoint（如 Lab 12）。按队列深度和 GPU 利用率自动扩缩容。向用户流式展示进度。跟踪每个<strong>成功任务<\/strong>的成本，而不是每次调用的成本。<\/p>"}, {"id": "L13", "section": "L", "star": true, "q_en": "What is prompt caching, and how do you design prompts for it?", "a_en": "<p>The provider stores the processed state (the KV cache) of a prompt <strong>prefix<\/strong>, so a later request that starts with exactly the same tokens skips recomputing it. That makes reading from the cache much cheaper and gives a faster first token. It matches on an exact prefix, so put <strong>stable content first<\/strong> (system prompt, tool definitions, long documents) and variable content last (the new user message). Don't put timestamps or IDs at the top. Entries expire after a few minutes unless reused, and some providers charge a bit more to write the cache. Agents benefit a lot, because each step resends the same prefix.<\/p>", "q_zh": "什么是 prompt caching？如何为它设计 prompt？", "a_zh": "<p>厂商保存某个 prompt <strong>前缀<\/strong>处理后的状态（KV cache），之后以完全相同 token 开头的请求可以跳过重新计算。读缓存便宜得多，首 token 也更快。它按精确前缀匹配，所以把<strong>稳定内容放前面<\/strong>（系统提示、工具定义、长文档），可变内容放最后（新的用户消息）。不要把时间戳或 ID 放在开头。缓存项几分钟不用就会过期，有些厂商写缓存会略贵。Agent 受益很大，因为每一步都重发相同的前缀。<\/p>"}, {"id": "L14", "section": "L", "star": false, "q_en": "Prompt caching vs semantic caching vs the KV cache?", "a_en": "<p>The <em>KV cache<\/em> is inside one generation (reusing attention state for earlier tokens). <em>Prompt caching<\/em> reuses that state <em>across requests<\/em> with an identical prefix, and the answer is still freshly generated. <em>Semantic caching<\/em> is an application cache that returns a <strong>stored answer<\/strong> when a new query is similar enough. It's cheaper still, but it risks stale or wrong answers and permission leaks, so it needs tenant and ACL keys and a strict similarity threshold. (Your repo's Redis search cache is an exact-match application cache.)<\/p>", "q_zh": "Prompt caching、语义缓存和 KV cache 的区别？", "a_zh": "<p><em>KV cache<\/em> 在一次生成内部（复用之前 token 的 attention 状态）。<em>Prompt caching<\/em> 在<strong>跨请求<\/strong>、前缀完全相同时复用这个状态，答案仍是重新生成的。*语义缓存*是应用层缓存：新查询足够相似时直接返回<strong>保存的答案<\/strong>。它更省钱，但有答案过时、错误和权限泄露的风险，所以必须以租户和 ACL 为键，并使用严格的相似度阈值。（本项目的 Redis 搜索缓存是精确匹配的应用缓存。）<\/p>"}, {"id": "L15", "section": "L", "star": true, "q_en": "What are reasoning models, and how do they change agent design?", "a_en": "<p>They generate an internal chain of reasoning (\"thinking\") before answering, trained with RL to plan, check and backtrack. They're better at multi-step planning, math, code and ambiguous tool choices, but slower, and thinking tokens cost money. Design changes: less hand-written scaffolding (\"think step by step\" is redundant), a thinking-budget setting per task, a reasoning model only for the hard nodes (planner, verifier) with fast models elsewhere, and awareness that the visible reasoning is not a guaranteed faithful explanation. Keep deterministic checks.<\/p>", "q_zh": "什么是推理模型？它们如何改变 Agent 的设计？", "a_zh": "<p>它们在回答前生成内部的推理链（“思考”），通过强化学习训练出规划、检查和回溯的能力。在多步规划、数学、代码和模糊的工具选择上更强，但更慢，思考 token 也要付费。设计上的变化：更少的手写脚手架（“一步步思考”已多余）；按任务设置思考预算；只在困难节点（规划器、校验器）用推理模型，其余用快速模型；意识到可见的推理不一定是忠实的解释。确定性检查仍要保留。<\/p>"}, {"id": "L16", "section": "L", "star": false, "q_en": "What is test-time compute beyond \"thinking\"?", "a_en": "<p>Spending more inference to get a better answer: self-consistency (sample several answers and take the majority), best-of-n with a verifier or reward model, tree search over steps, and generate-then-critique loops. Each multiplies cost, so use them where errors are expensive and a checker exists (tests, schemas, retrieval citations).<\/p>", "q_zh": "除了“思考”，test-time compute 还有哪些？", "a_zh": "<p>花更多推理算力换更好的答案：自洽性（采样多个答案取多数）、配合验证器或奖励模型的 best-of-n、对步骤做树搜索、生成-批评循环。每一种都成倍增加成本，所以用在错误代价高且有检查器（测试、schema、检索引用）的地方。<\/p>"}, {"id": "L17", "section": "L", "star": true, "q_en": "Compare LangGraph, the OpenAI Agents SDK and the Claude Agent SDK. When would you use none?", "a_en": "<p><em>LangGraph<\/em> is low-level: an explicit state graph, reducers, checkpointers, interrupts and time travel. Choose it when you need control and durable, auditable workflows (my Lab 12). The <em>OpenAI Agents SDK<\/em> offers agents with tools, handoffs, guardrails, sessions and built-in tracing, and it's quick for multi-agent handoff patterns. The <em>Claude Agent SDK<\/em> exposes the harness behind Claude Code: built-in file, shell and web tools, permission modes, hooks, subagents, MCP and automatic context management. It fits agents that <em>work on a computer or codebase<\/em>. Use <strong>none<\/strong> when a single structured-output call or a plain workflow does the job, or when you need to understand and own every edge (my Lab 11).<\/p>", "q_zh": "比较 LangGraph、OpenAI Agents SDK 和 Claude Agent SDK。什么时候一个都不用？", "a_zh": "<p><em>LangGraph<\/em> 偏底层：显式状态图、reducer、checkpointer、中断和时间旅行。需要控制力以及持久、可审计的工作流时选它（我的 Lab 12）。<em>OpenAI Agents SDK<\/em> 提供带工具的 agent、handoff、guardrail、会话和内置 tracing，适合快速搭建多 agent handoff。<em>Claude Agent SDK<\/em> 开放了 Claude Code 背后的运行框架：内置文件、shell 和 web 工具、权限模式、hooks、子 agent、MCP 和自动上下文管理，适合<strong>在电脑或代码库上干活<\/strong>的 Agent。当一次结构化输出调用或一个普通 workflow 就能完成任务、或你需要理解并掌控每一条边时（我的 Lab 11），一个都不用。<\/p>"}, {"id": "L18", "section": "L", "star": false, "q_en": "What did LangGraph give you, and what did you still have to build?", "a_en": "<p>It gave me the graph, conditional edges, a state schema with reducers (the <code>events<\/code> list), per-node retry policies, durable checkpoints per step, pause and resume, and state inspection (<code>aget_state<\/code>). I still had to build authorization and identity (<code>acting_as<\/code>), the idempotency key and ledger, approval expiry, verification rules, the run registry, and evaluation. Frameworks give you <em>orchestration<\/em>, not <em>governance<\/em>.<\/p>", "q_zh": "LangGraph 给了你什么？你还得自己做什么？", "a_zh": "<p>它给了我：图、条件边、带 reducer 的状态 schema（<code>events<\/code> 列表）、按节点的重试策略、每一步的持久 checkpoint、暂停与恢复，以及状态查看（<code>aget_state<\/code>）。我仍需自己实现：授权与身份（<code>acting_as<\/code>）、幂等键和账本、审批过期、校验规则、run 注册表以及评估。框架给你的是<strong>编排<\/strong>，不是<strong>治理<\/strong>。<\/p>"}, {"id": "L19", "section": "L", "star": false, "q_en": "Agent framework vs durable execution engine (Temporal)?", "a_en": "<p>Agent frameworks model LLM-specific control flow (tools, messages, handoffs) and offer basic persistence. Durable-execution engines (Temporal, and cloud workflow services) guarantee that long workflows survive crashes, with retries, timers, versioning and exactly-once <em>workflow<\/em> semantics across machines and days. For long-running, business-critical agents, teams often run agent steps as activities inside a durable workflow.<\/p>", "q_zh": "Agent 框架与持久化执行引擎（Temporal）的区别？", "a_zh": "<p>Agent 框架建模 LLM 特有的控制流（工具、消息、handoff），并提供基本的持久化。持久化执行引擎（Temporal 以及云上的工作流服务）保证长工作流能在崩溃后继续，提供重试、定时器、版本化，以及跨机器、跨天的“恰好一次”<strong>工作流<\/strong>语义。对长时间运行、关键业务的 Agent，团队常把 Agent 步骤作为 activity 放在持久化工作流中运行。<\/p>"}, {"id": "L20", "section": "L", "star": true, "q_en": "Explain the MCP architecture", "a_en": "<p>A <strong>host<\/strong> (Claude Desktop, Claude Code, an IDE, your app) runs one <strong>client<\/strong> per <strong>server<\/strong> connection. Servers expose three primitives: <strong>tools<\/strong> (actions the model can call), <strong>resources<\/strong> (data the application can read) and <strong>prompts<\/strong> (reusable templates). Clients can offer servers <strong>sampling<\/strong> (ask the host's model), <strong>roots<\/strong> and <strong>elicitation<\/strong> (ask the user). Transports are <strong>stdio<\/strong> for local subprocesses and <strong>Streamable HTTP<\/strong> for remote servers, with OAuth-based authorization for HTTP. Messages are JSON-RPC. My server is a stdio or HTTP server with one read-only tool.<\/p>", "q_zh": "解释 MCP 的架构。", "a_zh": "<p><strong>Host<\/strong>（Claude Desktop、Claude Code、IDE 或你的应用）为每个 <strong>server<\/strong> 连接运行一个 <strong>client<\/strong>。Server 暴露三种原语：<strong>tools<\/strong>（模型可调用的动作）、<strong>resources<\/strong>（应用可读取的数据）和 <strong>prompts<\/strong>（可复用模板）。Client 可以向 server 提供 <strong>sampling<\/strong>（请求 host 的模型）、<strong>roots<\/strong> 和 <strong>elicitation<\/strong>（向用户提问）。传输方式：本地子进程用 <strong>stdio<\/strong>，远程 server 用 <strong>Streamable HTTP<\/strong>，HTTP 使用基于 OAuth 的授权。消息格式是 JSON-RPC。我的 server 是只有一个只读工具的 stdio 或 HTTP server。<\/p>"}, {"id": "L21", "section": "L", "star": true, "q_en": "What are the main MCP security risks?", "a_en": "<p><em>Tool poisoning:<\/em> malicious instructions hidden in tool descriptions or results. <em>Rug pulls:<\/em> a server changes a tool's behavior after you approved it. <em>Confused deputy and over-broad scopes:<\/em> a server acting with more power than the user. <em>Token passthrough:<\/em> forwarding client tokens to downstream APIs. And ordinary supply-chain risk from installing third-party servers. Mitigations: allowlist and pin servers, review tool descriptions, give least-privilege credentials per server, never trust annotations from unknown servers, require approval for risky tools, and treat all tool output as untrusted data.<\/p>", "q_zh": "MCP 主要有哪些安全风险？", "a_zh": "<p><em>工具投毒<\/em>：藏在工具描述或结果中的恶意指令。<em>Rug pull<\/em>：你批准后 server 改变了工具行为。<em>混淆代理与权限过宽<\/em>：server 以比用户更大的权限行事。<em>Token 透传<\/em>：把客户端 token 转发给下游 API。以及安装第三方 server 带来的普通供应链风险。缓解：对 server 做白名单并锁定版本，审阅工具描述，每个 server 使用最小权限凭证，不信任未知 server 的注解，高风险工具需要审批，所有工具输出都当作不可信数据。<\/p>"}, {"id": "L22", "section": "L", "star": false, "q_en": "What is A2A, and when would you use it instead of MCP?", "a_en": "<p>The Agent2Agent protocol lets independent agents, possibly from different vendors or organizations, discover each other through an <strong>Agent Card<\/strong> (capabilities, endpoint, auth) and delegate <strong>tasks<\/strong> with a lifecycle, messages and artifacts. Use MCP when your agent needs a <em>tool or data source<\/em>. Use A2A when you're handing work to another <em>agent<\/em> that owns its own reasoning, tools and policies (for example, your procurement agent asks a supplier's quoting agent).<\/p>", "q_zh": "A2A 是什么？什么时候用它而不是 MCP？", "a_zh": "<p>Agent2Agent 协议让独立的 Agent（可能来自不同厂商或组织）通过 <strong>Agent Card<\/strong>（能力、端点、认证方式）互相发现，并以带生命周期、消息和产物的<strong>任务<\/strong>来委派工作。当你的 Agent 需要一个<strong>工具或数据源<\/strong>时用 MCP；当你把工作交给另一个拥有自己推理、工具和策略的 <strong>Agent<\/strong> 时用 A2A（例如你的采购 Agent 请求供应商的报价 Agent）。<\/p>"}, {"id": "L23", "section": "L", "star": true, "q_en": "Name agent benchmarks and what each measures", "a_en": "<p><em>SWE-bench (Verified):<\/em> resolve real GitHub issues so hidden tests pass (coding agents). <em>τ-bench:<\/em> tool-using customer-service agents that talk to a simulated user under domain policies (retail, airline). It introduced <strong>pass^k<\/strong> for reliability. <em>GAIA:<\/em> general assistant questions needing browsing, files and reasoning. <em>WebArena / OSWorld:<\/em> acting in websites and full desktop operating systems. <em>BFCL (Berkeley Function Calling Leaderboard):<\/em> function-calling accuracy, including parallel calls and when <em>not<\/em> to call. <em>Terminal-Bench:<\/em> command-line tasks.<\/p>", "q_zh": "说出一些 Agent benchmark 以及它们衡量什么。", "a_zh": "<p><em>SWE-bench（Verified）<\/em>：解决真实的 GitHub issue，使隐藏测试通过（编程 Agent）。<em>τ-bench<\/em>：在领域策略下与模拟用户对话的工具型客服 Agent（零售、航空），提出了衡量可靠性的 <strong>pass^k<\/strong>。<em>GAIA<\/em>：需要浏览、文件和推理的通用助手问题。<em>WebArena / OSWorld<\/em>：在网站和完整桌面操作系统中操作。<em>BFCL（Berkeley Function Calling Leaderboard）<\/em>：函数调用准确率，包括并行调用以及何时<strong>不该<\/strong>调用。<em>Terminal-Bench<\/em>：命令行任务。<\/p>"}, {"id": "L24", "section": "L", "star": false, "q_en": "What are the limits of public benchmarks?", "a_en": "<p>Contamination (test data leaks into training), saturation (top scores cluster), scaffold dependence (the harness matters as much as the model), and a domain mismatch with <em>your<\/em> tools, data and policies. Use them to shortlist models, then decide with your own suite: golden, adversarial and repeated trials (like <code>eval/run_agent_suite.py<\/code>).<\/p>", "q_zh": "公开 benchmark 有哪些局限？", "a_zh": "<p>数据污染（测试数据泄露进训练集）、饱和（顶尖分数挤在一起）、依赖脚手架（框架和模型一样重要），以及与<strong>你的<\/strong>工具、数据和策略不匹配。用它们来初筛模型，然后用你自己的套件做决定：golden、对抗性和多次重复（如 <code>eval/run_agent_suite.py<\/code>）。<\/p>"}, {"id": "L25", "section": "L", "star": false, "q_en": "How is function-calling accuracy measured?", "a_en": "<p>Whether the model picks the right function (or correctly none), whether the arguments are correct and schema-valid, whether it handles multiple and parallel calls, and whether it avoids hallucinated functions. Checks compare against expected calls (AST or structure matching) or execute the calls and check results. In my suite, <code>tools_in_order<\/code>, <code>tools_not_proposed<\/code> and the per-step <code>invalid_action<\/code> status play the same role.<\/p>", "q_zh": "函数调用的准确率怎么衡量？", "a_zh": "<p>看模型是否选对函数（或正确地不调用），参数是否正确且符合 schema，能否处理多个和并行调用，以及是否会编造不存在的函数。检查方式是与期望调用比对（AST 或结构匹配），或实际执行调用再检查结果。在我的套件中，<code>tools_in_order<\/code>、<code>tools_not_proposed<\/code> 以及每步的 <code>invalid_action<\/code> 状态起同样的作用。<\/p>"}, {"id": "L26", "section": "L", "star": true, "q_en": "Walk through the OWASP Top 10 for LLM Applications and map it to your project", "a_en": "<p>In the 2025 list: <strong>LLM01 Prompt Injection:<\/strong> untrusted-data prompts, the verify node, the approval gate and injection tests. <strong>LLM02 Sensitive Information Disclosure:<\/strong> ACL before retrieval, no prompts in logs. <strong>LLM03 Supply Chain:<\/strong> pinned dependencies and allowlisted MCP servers. <strong>LLM04 Data and Model Poisoning:<\/strong> the governance lifecycle, since only published documents are retrieved. <strong>LLM05 Improper Output Handling:<\/strong> schema validation and the AST calculator (never <code>eval<\/code>). <strong>LLM06 Excessive Agency:<\/strong> a three-tool allowlist, risk tiers and human approval. <strong>LLM07 System Prompt Leakage:<\/strong> no secrets in prompts. <strong>LLM08 Vector and Embedding Weaknesses:<\/strong> tenant and ACL filters in vector search. <strong>LLM09 Misinformation:<\/strong> citations and citation accuracy. <strong>LLM10 Unbounded Consumption:<\/strong> step, token, cost and time budgets.<\/p>", "q_zh": "逐项讲讲 OWASP LLM 应用 Top 10，并对应到你的项目。", "a_zh": "<p>2025 版：<strong>LLM01 提示注入<\/strong>：不可信数据 prompt、verify 节点、审批闸门、注入测试。<strong>LLM02 敏感信息泄露<\/strong>：检索前 ACL、日志里不记录 prompt。<strong>LLM03 供应链<\/strong>：锁定依赖版本、MCP server 白名单。<strong>LLM04 数据与模型投毒<\/strong>：治理生命周期，只检索已发布的文档。<strong>LLM05 输出处理不当<\/strong>：schema 校验和 AST 计算器（从不 <code>eval<\/code>）。<strong>LLM06 过度代理<\/strong>：三个工具的白名单、风险分级和人工审批。<strong>LLM07 系统提示泄露<\/strong>：prompt 中不放密钥。<strong>LLM08 向量与嵌入弱点<\/strong>：向量检索中的租户和 ACL 过滤。<strong>LLM09 错误信息<\/strong>：引用和引用准确率。<strong>LLM10 无限制消耗<\/strong>：步数、token、成本和时间预算。<\/p>"}, {"id": "L27", "section": "L", "star": false, "q_en": "What are the NIST AI RMF, ISO/IEC 42001 and MITRE ATLAS, and when do you mention them?", "a_en": "<p>The <strong>NIST AI Risk Management Framework<\/strong> organizes AI risk work into four functions: <em>Govern, Map, Measure, Manage<\/em>. It's useful for structuring a governance program. <strong>ISO/IEC 42001<\/strong> is a certifiable AI <em>management system<\/em> standard, like ISO 27001 but for AI. <strong>MITRE ATLAS<\/strong> is a knowledge base of adversary tactics and techniques against AI systems, like ATT&amp;CK, and it's useful for threat modelling and red-team planning. Mention them when discussing enterprise rollout, compliance or security reviews, and back each with a concrete control from your design.<\/p>", "q_zh": "NIST AI RMF、ISO/IEC 42001 和 MITRE ATLAS 是什么？什么时候提到它们？", "a_zh": "<p><strong>NIST AI 风险管理框架<\/strong>把 AI 风险工作组织成四个职能：<em>治理（Govern）、映射（Map）、测量（Measure）、管理（Manage）<\/em>，适合用来搭建治理体系。<strong>ISO/IEC 42001<\/strong> 是可认证的 AI <strong>管理体系<\/strong>标准，类似 ISO 27001，但针对 AI。<strong>MITRE ATLAS<\/strong> 是针对 AI 系统的攻击战术与技术知识库，类似 ATT&amp;CK，适合做威胁建模和红队规划。讨论企业落地、合规或安全评审时提到它们，并为每一项配上你设计中的具体控制措施。<\/p>"}, {"id": "L28", "section": "L", "star": true, "q_en": "How would you threat-model an agent?", "a_en": "<p>List the assets (data, credentials, write capabilities), the trust boundaries (user, model, tools, retrieved content, MCP servers, external systems) and the data flows. For each tool, ask: what's the worst thing an attacker who controls the model's input could make it do? Check the <strong>lethal trifecta<\/strong> (private data + untrusted content + an external channel). Controls: least-privilege tools, identity propagation, deterministic verification, human approval by risk, output filtering, budgets, and full audit trails. Then red-team it with adversarial tasks and keep them as regression tests.<\/p>", "q_zh": "你会如何给 Agent 做威胁建模？", "a_zh": "<p>列出资产（数据、凭证、写入能力）、信任边界（用户、模型、工具、检索内容、MCP server、外部系统）和数据流。对每个工具问：一个控制了模型输入的攻击者，最坏能让它做什么？检查<strong>致命三要素<\/strong>（私有数据 + 不可信内容 + 对外通道）。控制措施：最小权限工具、身份传递、确定性校验、按风险人工审批、输出过滤、预算以及完整的审计轨迹。然后用对抗性任务做红队测试，并把它们保留为回归测试。<\/p>"}, {"id": "L29", "section": "L", "star": false, "q_en": "What is \"excessive agency\", and how do you control it?", "a_en": "<p>Giving an agent more <em>functionality<\/em>, <em>permissions<\/em> or <em>autonomy<\/em> than the task needs. For example, a \"manage email\" tool when it only needs \"read inbox\", or database admin credentials for a read query. Controls: narrow single-purpose tools, least-privilege credentials per user, approval for high-impact actions, rate and budget limits, and audit logs. In my repo: three tools, one internal write, approval, idempotency and budgets.<\/p>", "q_zh": "什么是“过度代理”（excessive agency）？如何控制？", "a_zh": "<p>给 Agent 的<strong>功能<\/strong>、<strong>权限<\/strong>或<strong>自主性<\/strong>超出了任务所需。例如只需要“读收件箱”却给了“管理邮件”工具，或为一次只读查询给了数据库管理员凭证。控制：单一用途的窄工具、按用户的最小权限凭证、高影响动作需要审批、限流和预算、审计日志。在我的项目中：三个工具、一个内部写入、审批、幂等和预算。<\/p>"}], "groups": [{"en": "LLM basics", "zh": "LLM 基础"}, {"en": "Retrieval / RAG", "zh": "检索 / RAG"}, {"en": "Agents", "zh": "Agent"}, {"en": "Evaluation / ops / security", "zh": "评估 / 运维 / 安全"}], "glossary": [{"group": "LLM basics", "term": "Token", "term_zh": "词元", "en": "The unit a model reads and writes, roughly ¾ of an English word. Cost, speed, and limits are all counted in tokens.", "repo": "Byte-based reservation in <code>runtime.py<\/code>", "zh": "模型读写的基本单位，约等于 ¾ 个英文单词。成本、速度和上限都按 token 计算。"}, {"group": "LLM basics", "term": "Context window", "term_zh": "上下文窗口", "en": "The maximum tokens a model can see in one call, input plus output.", "repo": "–", "zh": "模型单次调用能看到的最大 token 数（输入 + 输出）。"}, {"group": "LLM basics", "term": "Temperature", "term_zh": "温度", "en": "Randomness of sampling. Low is more predictable, which is better for tool choice.", "repo": "–", "zh": "采样的随机程度。越低越稳定，工具选择时更合适。"}, {"group": "LLM basics", "term": "Structured output", "term_zh": "结构化输出", "en": "Forcing the model's output to match a JSON Schema.", "repo": "<code>output_schema=<\/code> in agent/extraction", "zh": "强制模型输出符合某个 JSON Schema。"}, {"group": "LLM basics", "term": "Hallucination", "term_zh": "幻觉", "en": "Fluent but unsupported output.", "repo": "Citation checks", "zh": "语句流畅但没有依据的输出。"}, {"group": "LLM basics", "term": "Embedding", "term_zh": "向量嵌入", "en": "A list of numbers that encodes meaning. Similar meaning gives nearby vectors.", "repo": "Ollama <code>embeddinggemma<\/code>", "zh": "表示语义的一串数字；语义相近，向量就相近。"}, {"group": "LLM basics", "term": "Cosine similarity", "term_zh": "余弦相似度", "en": "The angle-based similarity between two vectors.", "repo": "<code>chunking.py cosine()<\/code>", "zh": "基于两个向量夹角的相似度。"}, {"group": "LLM basics", "term": "System prompt", "term_zh": "系统提示词", "en": "Standing instructions that sit above user input.", "repo": "<code>SYSTEM<\/code> in <code>runtime.py<\/code>", "zh": "位于用户输入之上的常驻指令。"}, {"group": "LLM basics", "term": "Prompt caching / KV cache", "term_zh": "", "en": "Reusing computation for a repeated prompt prefix, which makes it cheaper and faster.", "repo": "–", "zh": "复用重复 prompt 前缀的计算结果，更便宜、更快。"}, {"group": "LLM basics", "term": "Reasoning model", "term_zh": "推理模型", "en": "A model that \"thinks\" (generates hidden reasoning) before answering. Better at hard steps, but slower and costlier.", "repo": "–", "zh": "回答前先“思考”（生成隐藏推理）的模型。难题更强，但更慢、更贵。"}, {"group": "LLM basics", "term": "Self-attention", "term_zh": "自注意力", "en": "Each token weighs every earlier token to build its representation.", "repo": "–", "zh": "每个 token 参考前面所有 token 来构建自己的表示。"}, {"group": "LLM basics", "term": "Pretraining / SFT / RLHF / DPO", "term_zh": "", "en": "Learn language → learn to follow instructions → learn preferences (with an RL loop / directly).", "repo": "–", "zh": "学语言 → 学会遵循指令 → 学习偏好（RLHF 用强化学习循环 / DPO 直接优化）。"}, {"group": "LLM basics", "term": "LoRA / QLoRA", "term_zh": "", "en": "Fine-tune small low-rank adapters instead of all weights (QLoRA: on a 4-bit base).", "repo": "–", "zh": "只微调小的低秩适配器而不是全部权重（QLoRA：基座模型以 4-bit 存储）。"}, {"group": "LLM basics", "term": "Quantization", "term_zh": "量化", "en": "Store weights in fewer bits (int8/int4): smaller and faster, some quality loss.", "repo": "–", "zh": "用更少的比特存权重（int8/int4）：更小更快，质量略有损失。"}, {"group": "LLM basics", "term": "TTFT", "term_zh": "首 token 延迟", "en": "Time to first token, set by prompt length (prefill).", "repo": "<code>/observability/summary<\/code> latencies", "zh": "首个 token 的等待时间，主要由 prompt 长度（prefill）决定。"}, {"group": "Retrieval / RAG", "term": "RAG", "term_zh": "检索增强生成", "en": "Retrieve evidence first, then have the LLM answer from it.", "repo": "<code>services/rag.py<\/code>", "zh": "先检索证据，再让 LLM 基于证据回答。"}, {"group": "Retrieval / RAG", "term": "Chunking / overlap", "term_zh": "分块/重叠", "en": "Splitting documents into retrievable pieces, repeating a bit at the boundaries.", "repo": "<code>ingestion/chunking.py<\/code>", "zh": "把文档切成可检索的片段，并在边界处保留少量重叠。"}, {"group": "Retrieval / RAG", "term": "BM25", "term_zh": "关键词检索", "en": "Keyword relevance based on term frequency, rarity, and length.", "repo": "Elasticsearch", "zh": "基于词频、词的稀有度和文档长度的关键词相关性算法。"}, {"group": "Retrieval / RAG", "term": "Dense retrieval", "term_zh": "稠密/向量检索", "en": "Search by embedding similarity.", "repo": "Qdrant", "zh": "按 embedding 相似度检索。"}, {"group": "Retrieval / RAG", "term": "ANN / HNSW", "term_zh": "近似最近邻", "en": "Fast <em>approximate<\/em> vector search that trades a little recall for speed.", "repo": "Qdrant internals", "zh": "快速的<strong>近似<\/strong>向量检索，用少量召回换速度。"}, {"group": "Retrieval / RAG", "term": "Hybrid search", "term_zh": "混合检索", "en": "Keyword + vector search combined.", "repo": "<code>services/hybrid.py<\/code>", "zh": "关键词检索 + 向量检索的结合。"}, {"group": "Retrieval / RAG", "term": "RRF", "term_zh": "倒数排名融合", "en": "Score = Σ 1/(k + rank) across result lists.", "repo": "<code>retrieval/fusion.py<\/code>", "zh": "得分 = 各结果列表中 Σ 1/(k + 排名)。"}, {"group": "Retrieval / RAG", "term": "Reranker", "term_zh": "重排序", "en": "A slower, more precise second pass over a shortlist.", "repo": "<code>retrieval/rerank.py<\/code>", "zh": "对候选短名单做更慢但更精确的第二轮排序。"}, {"group": "Retrieval / RAG", "term": "Bi-encoder vs cross-encoder", "term_zh": "", "en": "Encode query and doc separately (fast) vs together (accurate).", "repo": "Reranker options", "zh": "查询和文档分开编码（快）vs 一起编码（准）。"}, {"group": "Retrieval / RAG", "term": "Query rewrite / multi-query", "term_zh": "查询改写", "en": "Generating alternative phrasings to improve recall.", "repo": "<code>retrieval/query_rewrite.py<\/code>", "zh": "生成多种改写查询以提高召回。"}, {"group": "Retrieval / RAG", "term": "HyDE", "term_zh": "", "en": "Embed a <em>hypothetical answer<\/em> instead of the question.", "repo": "–", "zh": "用“假设的答案”的 embedding 去检索，而不是问题本身。"}, {"group": "Retrieval / RAG", "term": "Metadata filter / pre-filter", "term_zh": "元数据过滤", "en": "Restricting search by fields such as tenant, date, or ACL <em>during<\/em> retrieval.", "repo": "<code>RetrievalFilters<\/code>", "zh": "在检索<strong>过程中<\/strong>按租户、日期、ACL 等字段过滤。"}, {"group": "Retrieval / RAG", "term": "Parent-child retrieval", "term_zh": "", "en": "Match small chunks, then return the bigger section they belong to.", "repo": "–", "zh": "用小片段匹配，再返回它所属的大段落。"}, {"group": "Retrieval / RAG", "term": "GraphRAG", "term_zh": "", "en": "Using entity-relationship traversal as evidence.", "repo": "<code>services/graph.py<\/code>", "zh": "用实体-关系遍历作为证据。"}, {"group": "Retrieval / RAG", "term": "Multi-hop", "term_zh": "多跳", "en": "An answer that needs chaining facts: A→B→C.", "repo": "Company→Contract→Customer", "zh": "需要串联多个事实才能回答：A→B→C。"}, {"group": "Retrieval / RAG", "term": "Ontology / taxonomy", "term_zh": "本体/分类体系", "en": "Schema of entity types and relations / a hierarchy of categories.", "repo": "<code>dto/graph.py<\/code>", "zh": "实体类型与关系的模式 / 分类层级。"}, {"group": "Retrieval / RAG", "term": "Entity resolution", "term_zh": "实体消歧/合并", "en": "Deciding whether two records refer to the same real thing.", "repo": "<code>refinement/entity_resolution.py<\/code> (Lab 7)", "zh": "判断两条记录是否指向同一个真实实体。"}, {"group": "Agents", "term": "Agent", "term_zh": "智能体", "en": "A loop where the model chooses the next action, the app executes it, and the result feeds back, until a stop condition.", "repo": "<code>AgentRuntime.loop<\/code>", "zh": "一个循环：模型选择下一步动作，应用执行，结果反馈回来，直到满足停止条件。"}, {"group": "Agents", "term": "Workflow", "term_zh": "工作流", "en": "A path predefined in code. The LLM fills steps but doesn't choose the route.", "repo": "<code>required_tools<\/code> makes part of it a workflow", "zh": "在代码中预先定义好的路径；LLM 负责填充步骤，但不决定路线。"}, {"group": "Agents", "term": "Tool / function calling", "term_zh": "工具调用", "en": "The model <em>proposes<\/em> a call as structured data, and the <strong>application<\/strong> executes it.", "repo": "<code>TOOLS<\/code>, <code>execute_read<\/code>", "zh": "模型以结构化数据<strong>提出<\/strong>调用，由<strong>应用<\/strong>执行。"}, {"group": "Agents", "term": "Tool schema / contract", "term_zh": "工具契约", "en": "Name, description, and typed arguments/results, plus side-effect and permission rules.", "repo": "<code>SearchArguments<\/code>, etc.", "zh": "名称、描述、带类型的参数/结果，以及副作用和权限规则。"}, {"group": "Agents", "term": "Action / observation", "term_zh": "动作/观察", "en": "What the model asked for / what the tool returned.", "repo": "<code>run[&quot;observations&quot;]<\/code>", "zh": "模型请求做什么 / 工具返回了什么。"}, {"group": "Agents", "term": "ReAct", "term_zh": "", "en": "Reason → Act → Observe, repeated. The classic agent pattern.", "repo": "Your loop is ReAct-style without visible reasoning", "zh": "推理 → 行动 → 观察，循环往复。经典的 Agent 模式。"}, {"group": "Agents", "term": "Plan-and-execute", "term_zh": "", "en": "Make a full plan first, then run the steps.", "repo": "Lab 12 is a fixed plan with one model step", "zh": "先制定完整计划，再逐步执行。"}, {"group": "Agents", "term": "Reflection / evaluator-optimizer", "term_zh": "", "en": "The model critiques its own output and revises it.", "repo": "–", "zh": "模型评审自己的输出并修改。"}, {"group": "Agents", "term": "State", "term_zh": "状态", "en": "The authoritative task progress, stored in a database.", "repo": "<code>agent_runs<\/code> row", "zh": "任务的权威进度，存在数据库里。"}, {"group": "Agents", "term": "Context", "term_zh": "上下文", "en": "What the model sees <em>in this one call<\/em>.", "repo": "The <code>user<\/code> string built each step", "zh": "模型<strong>这一次调用<\/strong>看到的内容。"}, {"group": "Agents", "term": "Memory", "term_zh": "记忆", "en": "Information kept <em>across<\/em> turns or runs, chosen selectively.", "repo": "<code>agent/memory.py<\/code>, <code>/agent/memories<\/code>", "zh": "<strong>跨<\/strong>轮次或跨 run 有选择地保存的信息。"}, {"group": "Agents", "term": "Context engineering", "term_zh": "", "en": "Deciding exactly what goes into the context each step.", "repo": "<code>compact_observations<\/code>, hits truncated to 800 chars", "zh": "精确决定每一步放进上下文的内容。"}, {"group": "Agents", "term": "Checkpoint", "term_zh": "检查点", "en": "A persisted snapshot so a run can pause or resume.", "repo": "Lab 12 SQLite checkpointer; Lab 11 run row", "zh": "持久化的快照，使 run 可以暂停或恢复。"}, {"group": "Agents", "term": "HITL", "term_zh": "人在回路", "en": "A human approves, edits, or rejects a risky action.", "repo": "<code>approve()<\/code>", "zh": "由人批准、修改或拒绝高风险动作。"}, {"group": "Agents", "term": "Guardrail", "term_zh": "护栏", "en": "Checks on inputs, outputs, or behavior.", "repo": "Pydantic validation, <code>calculate<\/code> AST", "zh": "对输入、输出或行为的检查。"}, {"group": "Agents", "term": "Authorization", "term_zh": "授权", "en": "Whether <em>this identity<\/em> may do <em>this action<\/em>.", "repo": "<code>require_role(&quot;admin&quot;,&quot;approver&quot;)<\/code>", "zh": "<strong>这个身份<\/strong>是否可以执行<strong>这个动作<\/strong>。"}, {"group": "Agents", "term": "Idempotency key", "term_zh": "幂等键", "en": "A unique ID so repeating a request doesn't repeat its effect.", "repo": "<code>sha256(run_id + args)<\/code>", "zh": "唯一 ID，让重复请求不会重复产生效果。"}, {"group": "Agents", "term": "Execution ledger / receipt", "term_zh": "执行账本/回执", "en": "A durable record that an action happened.", "repo": "<code>followups<\/code> table", "zh": "动作已经发生的持久记录。"}, {"group": "Agents", "term": "Compensation / saga", "term_zh": "补偿", "en": "Undoing an effect with a new action when rollback is impossible.", "repo": "– (no external writes)", "zh": "无法回滚时，用新的动作抵消已产生的效果。"}, {"group": "Agents", "term": "Durable execution", "term_zh": "持久化执行", "en": "A workflow that survives crashes and resumes where it stopped.", "repo": "Lab 12 + crash demo", "zh": "能在崩溃后从中断处恢复的工作流。"}, {"group": "Agents", "term": "State graph", "term_zh": "状态图", "en": "Nodes (steps) and edges (routes) over a shared, checkpointed state.", "repo": "<code>graph_runtime.py<\/code>", "zh": "在共享且带 checkpoint 的状态上，由节点（步骤）和边（路由）组成的图。"}, {"group": "Agents", "term": "Handoff vs agent-as-tool", "term_zh": "", "en": "Transfer control to another agent / call another agent like a function.", "repo": "–", "zh": "把控制权交给另一个 agent / 像调用函数一样调用另一个 agent。"}, {"group": "Agents", "term": "Multi-agent", "term_zh": "多智能体", "en": "Several model-driven loops cooperating.", "repo": "–", "zh": "多个由模型驱动的循环协作。"}, {"group": "Agents", "term": "MCP", "term_zh": "", "en": "An open protocol for exposing tools, resources, and prompts to AI apps.", "repo": "<code>mcp_server.py<\/code>", "zh": "一个开放协议，向 AI 应用暴露工具、资源和提示模板。"}, {"group": "Agents", "term": "A2A", "term_zh": "", "en": "A protocol for agents to talk to <em>other agents<\/em>.", "repo": "–", "zh": "Agent 与<strong>其他 Agent<\/strong> 通信的协议。"}, {"group": "Agents", "term": "Prompt injection (direct / indirect)", "term_zh": "提示注入", "en": "Malicious instructions from the user / hidden in documents or tool output.", "repo": "\"untrusted data\" prompts", "zh": "来自用户的恶意指令 / 藏在文档或工具输出里的恶意指令。"}, {"group": "Agents", "term": "Trajectory", "term_zh": "轨迹", "en": "The full sequence of steps and tool calls in a run.", "repo": "<code>run[&quot;steps&quot;]<\/code>", "zh": "一次 run 中所有步骤和工具调用的完整序列。"}, {"group": "Evaluation / ops / security", "term": "Golden set", "term_zh": "黄金测试集", "en": "Fixed questions with known correct answers or sources.", "repo": "<code>eval/golden_set.example.json<\/code>", "zh": "有已知正确答案或来源的固定测试问题集。"}, {"group": "Evaluation / ops / security", "term": "Recall@K / Precision@K", "term_zh": "", "en": "Share of relevant items found in the top K / share of the top K that is relevant.", "repo": "<code>metrics.py<\/code>", "zh": "相关项有多少出现在前 K 个 / 前 K 个中有多少是相关的。"}, {"group": "Evaluation / ops / security", "term": "MRR", "term_zh": "", "en": "1 / rank of the first relevant hit.", "repo": "<code>metrics.py<\/code>", "zh": "第一个相关结果排名的倒数。"}, {"group": "Evaluation / ops / security", "term": "NDCG", "term_zh": "", "en": "A ranking quality score that rewards relevant items near the top.", "repo": "<code>metrics.py<\/code>", "zh": "奖励相关结果排在前面的排序质量分数。"}, {"group": "Evaluation / ops / security", "term": "Faithfulness", "term_zh": "忠实度", "en": "Is the answer supported by the given context?", "repo": "Judge prompt", "zh": "回答是否被给定的上下文支持？"}, {"group": "Evaluation / ops / security", "term": "Citation accuracy", "term_zh": "", "en": "Does the cited chunk exist, match, and come from an expected source?", "repo": "<code>services/evaluation.py<\/code>", "zh": "被引用的片段是否存在、匹配、并来自预期来源？"}, {"group": "Evaluation / ops / security", "term": "LLM-as-judge", "term_zh": "", "en": "Using a model to grade outputs. It's biased and must be calibrated.", "repo": "<code>judge=true<\/code>", "zh": "用模型给输出打分。有偏差，必须校准。"}, {"group": "Evaluation / ops / security", "term": "Regression gate", "term_zh": "回归门禁", "en": "Block a release if metrics drop against a baseline.", "repo": "<code>--baseline<\/code>", "zh": "指标相对基线下降时阻止发布。"}, {"group": "Evaluation / ops / security", "term": "Trace / span", "term_zh": "链路/跨度", "en": "A record of one request / one timed step inside it.", "repo": "<code>observability.py span()<\/code>", "zh": "一次请求的记录 / 其中一个计时步骤。"}, {"group": "Evaluation / ops / security", "term": "P95 latency", "term_zh": "", "en": "95% of requests are faster than this.", "repo": "<code>percentile()<\/code>", "zh": "95% 的请求比这个值快。"}, {"group": "Evaluation / ops / security", "term": "SLI / SLO / SLA", "term_zh": "", "en": "Metric / internal target / contractual promise.", "repo": "Bank #78", "zh": "度量指标 / 内部目标 / 对客户的正式承诺。"}, {"group": "Evaluation / ops / security", "term": "RBAC / ABAC / ACL", "term_zh": "", "en": "Role-based / attribute-based / per-resource list.", "repo": "<code>security.py<\/code>", "zh": "基于角色 / 基于属性 / 按资源的访问列表。"}, {"group": "Evaluation / ops / security", "term": "Tenant", "term_zh": "租户", "en": "An isolated customer or org boundary.", "repo": "<code>Principal.tenant<\/code>", "zh": "相互隔离的客户或组织边界。"}, {"group": "Evaluation / ops / security", "term": "Least privilege", "term_zh": "最小权限", "en": "Give each component only the access it needs.", "repo": "Tool allowlist", "zh": "每个组件只拥有它需要的权限。"}, {"group": "Evaluation / ops / security", "term": "pass@k / pass^k", "term_zh": "", "en": "At least one of k tries succeeds / all k tries succeed (reliability).", "repo": "<code>agent_metrics.py<\/code>", "zh": "k 次中至少一次成功 / k 次全部成功（衡量可靠性）。"}, {"group": "Evaluation / ops / security", "term": "Tool poisoning", "term_zh": "工具投毒", "en": "Malicious instructions hidden in a tool's description or output.", "repo": "MCP server <code>instructions<\/code>", "zh": "藏在工具描述或输出中的恶意指令。"}, {"group": "Evaluation / ops / security", "term": "OWASP LLM Top 10", "term_zh": "", "en": "The standard list of LLM application risks.", "repo": "§5 L26", "zh": "LLM 应用风险的标准清单。"}], "plan": [{"week": "0", "phase": "setup", "hours": "6–10", "title": {"en": "Setup and prerequisites", "zh": "环境搭建与前置知识"}, "goal": {"en": "The project runs on your machine and you know the tools.", "zh": "项目在你的电脑上跑起来，并熟悉所用工具。"}, "steps": {"en": ["Learn just enough HTTP/REST, Docker, Git, SQL and Python venv/async.", "pip install -e '.[dev,graph,agent]'; start Postgres, Redis, Elasticsearch, Qdrant.", "Install Ollama; pull llama3 and embeddinggemma.", "pytest -q passes; open /docs in the browser."], "zh": ["够用即可地学习 HTTP/REST、Docker、Git、SQL 和 Python venv/async。", "pip install -e '.[dev,graph,agent]'；启动 Postgres、Redis、Elasticsearch、Qdrant。", "安装 Ollama，拉取 llama3 和 embeddinggemma。", "pytest -q 通过；在浏览器打开 /docs。"]}, "output": {"en": "A note listing the five services and what each one does.", "zh": "一页笔记：五个服务分别做什么。"}}, {"week": "1", "phase": "platform", "hours": "10", "title": {"en": "The Knowledge API (Lab 1)", "zh": "知识 API（Lab 1）"}, "goal": {"en": "Understand how a request flows through a layered API.", "zh": "理解请求如何流经分层 API。"}, "steps": {"en": ["POST/GET/DELETE a document in Swagger.", "Trace main.py → api/documents.py → services/knowledge.py → repositories/documents.py.", "Break it: send an empty title; which layer rejects it?"], "zh": ["在 Swagger 中创建、查看、删除文档。", "追踪 main.py → api/documents.py → services/knowledge.py → repositories/documents.py。", "动手破坏：提交空标题，哪一层拒绝了它？"]}, "output": {"en": "A sequence diagram of POST /documents.", "zh": "POST /documents 的时序图。"}}, {"week": "2", "phase": "platform", "hours": "10", "title": {"en": "BM25 keyword search (Lab 2)", "zh": "BM25 关键词检索（Lab 2）"}, "goal": {"en": "Understand lexical retrieval and its blind spots.", "zh": "理解词法检索及其盲点。"}, "steps": {"en": ["Seed data; GET /search?q=annual leave.", "Compare 'C-101' with a paraphrase; read the ES mapping.", "Break it: search a synonym the documents don't contain."], "zh": ["导入示例数据；GET /search?q=annual leave。", "对比 “C-101” 与改写说法；阅读 ES mapping。", "动手破坏：搜索文档中没有的同义词。"]}, "output": {"en": "A 5-query table: your first mini golden set.", "zh": "5 个查询的结果表：你的第一个迷你 golden set。"}}, {"week": "3", "phase": "platform", "hours": "12", "title": {"en": "Embeddings, chunking, vector RAG (Lab 3)", "zh": "Embedding、分块与向量 RAG（Lab 3）"}, "goal": {"en": "Build intuition for embeddings and the basic RAG pipeline.", "zh": "建立对 embedding 和基础 RAG 流水线的直觉。"}, "steps": {"en": ["Follow labs/lab03_vector_rag.md: upload a PDF, preview chunks, index, POST /rag/query.", "Read chunking.py and services/rag.py.", "Break it: chunk_size 100 vs 3000 on the same question."], "zh": ["按 labs/lab03_vector_rag.md：上传 PDF、预览分块、建索引、POST /rag/query。", "阅读 chunking.py 和 services/rag.py。", "动手破坏：同一问题分别用 chunk_size 100 和 3000。"]}, "output": {"en": "A chunk-size comparison with a conclusion.", "zh": "分块大小对比及结论。"}}, {"week": "4", "phase": "platform", "hours": "12", "title": {"en": "Hybrid, RRF, rerank, evaluation (Lab 4)", "zh": "混合检索、RRF、重排序、评估（Lab 4）"}, "goal": {"en": "The core of every production RAG system.", "zh": "所有生产级 RAG 的核心。"}, "steps": {"en": ["POST /rag/hybrid with bm25 / vector / hybrid, rerank on and off.", "Run eval/run_eval.py for all modes.", "Hand-compute RRF; stop Qdrant and watch the graceful fallback."], "zh": ["POST /rag/hybrid 分别用 bm25 / vector / hybrid，并开关 rerank。", "对所有模式运行 eval/run_eval.py。", "手算 RRF；停掉 Qdrant，观察优雅降级。"]}, "output": {"en": "A metrics table and a recorded answer to 'Why hybrid?'", "zh": "指标表，以及“为什么要混合检索”的录音回答。"}}, {"week": "5", "phase": "knowledge", "hours": "8", "title": {"en": "Ontology and knowledge modelling (Lab 5)", "zh": "本体与知识建模（Lab 5）"}, "goal": {"en": "Turn a pile of text into a model of the business.", "zh": "把一堆文本变成业务模型。"}, "steps": {"en": ["Read dto/graph.py's minimal ontology.", "Write 5 competency questions and check the ontology answers them.", "Add one entity type and one relation, with a justification."], "zh": ["阅读 dto/graph.py 中的最小本体。", "写 5 个能力问题（competency questions），检查本体能否回答。", "增加一个实体类型和一个关系，并说明理由。"]}, "output": {"en": "Your extended ontology diagram.", "zh": "扩展后的本体图。"}}, {"week": "6", "phase": "knowledge", "hours": "10", "title": {"en": "Knowledge graph and GraphRAG (Lab 6)", "zh": "知识图谱与 GraphRAG（Lab 6）"}, "goal": {"en": "Multi-hop questions with explainable paths.", "zh": "带可解释路径的多跳问题。"}, "steps": {"en": ["Start Neo4j; extract, review and write a graph.", "Compare vector vs graph on a two-hop question.", "Break it: a three-hop question. What does traversal need?"], "zh": ["启动 Neo4j；抽取、审阅并写入图。", "在两跳问题上比较向量与图。", "动手破坏：三跳问题，遍历需要什么限制？"]}, "output": {"en": "A two-hop example with its evidence path.", "zh": "一个带证据路径的两跳示例。"}}, {"week": "7", "phase": "knowledge", "hours": "8", "title": {"en": "Entity resolution, duplicates, contradictions (Lab 7)", "zh": "实体消歧、近重复、矛盾检测（Lab 7）"}, "goal": {"en": "Refine knowledge without wrong merges.", "zh": "在不误合并的前提下提炼知识。"}, "steps": {"en": ["Follow labs/lab07_entity_resolution.md in Swagger.", "Read refinement/entity_resolution.py and its tests.", "Break it: lower MERGE_THRESHOLD to 0.8 and find the wrong merge."], "zh": ["按 labs/lab07_entity_resolution.md 在 Swagger 中练习。", "阅读 refinement/entity_resolution.py 及其测试。", "动手破坏：把 MERGE_THRESHOLD 调到 0.8，找出错误合并。"]}, "output": {"en": "Answer: design entity resolution for 10M company records.", "zh": "回答：为 1000 万条公司记录设计实体消歧。"}}, {"week": "8", "phase": "trust", "hours": "8", "title": {"en": "Governance, provenance, lifecycle (Lab 8)", "zh": "治理、溯源与生命周期（Lab 8）"}, "goal": {"en": "Only approved, current knowledge is retrievable, with a full audit trail.", "zh": "只有已批准、有效的知识可被检索，并有完整审计轨迹。"}, "steps": {"en": ["Move a document draft → validated → approved → published → deprecated.", "Roll back a version.", "GOVERNANCE_ENABLED=true: confirm unpublished documents are never retrieved."], "zh": ["把文档从 draft → validated → approved → published → deprecated。", "回滚一个版本。", "GOVERNANCE_ENABLED=true：确认未发布的文档不会被检索到。"]}, "output": {"en": "A lifecycle diagram with who may do each transition.", "zh": "生命周期图，标出每个转换由谁执行。"}}, {"week": "9", "phase": "trust", "hours": "12", "title": {"en": "Evaluation, observability, security (Labs 9–10)", "zh": "评估、可观测性、安全（Lab 9–10）"}, "goal": {"en": "Measure quality, see what happened, and prove access control.", "zh": "衡量质量、看清发生了什么、证明访问控制有效。"}, "steps": {"en": ["Generation evaluation with a baseline.", "Check /observability/summary.", "SECURITY_ENABLED with two identities: a low-clearance user can't retrieve restricted docs via RAG or the agent."], "zh": ["带基线的生成评估。", "查看 /observability/summary。", "开启 SECURITY_ENABLED 并使用两个身份：低权限用户无论通过 RAG 还是 Agent 都取不到受限文档。"]}, "output": {"en": "A 'quality dropped' incident runbook.", "zh": "“质量下降”事故处理手册。"}}, {"week": "10", "phase": "agent", "hours": "12", "title": {"en": "The agent loop from scratch (Lab 11)", "zh": "从零实现 Agent 循环（Lab 11）"}, "goal": {"en": "Know exactly what an agent is before using a framework.", "zh": "在使用框架前，彻底理解 Agent 是什么。"}, "steps": {"en": ["Follow lab11_agent_foundations.md steps 1–9.", "Read runtime.py and tests/test_agent_runtime.py.", "Run the combined task 5× without required_tools and count wrong answers."], "zh": ["按 lab11_agent_foundations.md 完成步骤 1–9。", "阅读 runtime.py 和 tests/test_agent_runtime.py。", "不加 required_tools 运行组合任务 5 次，统计错误答案。"]}, "output": {"en": "Draw the loop from memory; answer 'What is an agent?'", "zh": "凭记忆画出循环；回答“什么是 Agent？”"}}, {"week": "11", "phase": "agent", "hours": "10", "title": {"en": "Tools, memory, context, reliability", "zh": "工具、记忆、上下文与可靠性"}, "goal": {"en": "Function calling, context engineering, expiry and crash recovery.", "zh": "函数调用、上下文工程、审批过期与崩溃恢复。"}, "steps": {"en": ["Read memory.py and its tests.", "Optional: pull a tool-capable model and try mode=native_tools.", "Kill the API mid-run, restart, POST /agent/runs/{id}/resume."], "zh": ["阅读 memory.py 及其测试。", "可选：拉取支持工具调用的模型，尝试 mode=native_tools。", "在运行中杀掉 API，重启后 POST /agent/runs/{id}/resume。"]}, "output": {"en": "The crash-point table in your own words.", "zh": "用自己的话写出“崩溃点”表格。"}}, {"week": "12", "phase": "agent", "hours": "14", "title": {"en": "Durable agent, MCP, evaluation (Lab 12)", "zh": "持久化 Agent、MCP 与评估（Lab 12）"}, "goal": {"en": "Survive failures, pass an audit, and measure reliability.", "zh": "能扛住故障、通过审计、衡量可靠性。"}, "steps": {"en": ["Run the v2 flow with approval in Swagger.", "python scripts/lab12_crash_demo.py → PASS.", "Run the MCP server and connect a client.", "Run eval/run_agent_suite.py with 3 trials."], "zh": ["在 Swagger 中跑一遍带审批的 v2 流程。", "python scripts/lab12_crash_demo.py → PASS。", "运行 MCP server 并连接一个客户端。", "用 3 次重复运行 eval/run_agent_suite.py。"]}, "output": {"en": "Suite report + ADR: single vs multi-agent.", "zh": "评估报告 + ADR：单 Agent vs 多 Agent。"}}, {"week": "13", "phase": "models", "hours": "10", "title": {"en": "LLM fundamentals and ecosystem", "zh": "LLM 基础与生态"}, "goal": {"en": "Transformers, training, LoRA, inference, caching, reasoning models, frameworks, protocols, benchmarks, security frameworks.", "zh": "Transformer、训练、LoRA、推理、缓存、推理模型、框架、协议、Benchmark、安全框架。"}, "steps": {"en": ["One topic per day (see 08 guide Week 13 table).", "Answer every 'Models & ecosystem' card out loud.", "Re-study any answer over 2 minutes."], "zh": ["每天一个主题（见 08 指南第 13 周表格）。", "把“模型与生态”卡片逐一口头作答。", "超过 2 分钟的回答重新学习。"]}, "output": {"en": "All section L cards marked 'Know it'.", "zh": "L 部分所有卡片标记为“已掌握”。"}}, {"week": "14", "phase": "interview", "hours": "10", "title": {"en": "Your story and system design", "zh": "项目故事与系统设计"}, "goal": {"en": "Tell the project in 2 minutes; design under time pressure.", "zh": "2 分钟讲清项目；在时间压力下做设计。"}, "steps": {"en": ["Record the 2-minute and 5-minute pitch.", "Two 40-minute designs: knowledge assistant, refund agent.", "5 failure modes per design and how to detect them."], "zh": ["录制 2 分钟和 5 分钟版本的项目介绍。", "两个 40 分钟设计：知识助手、退款 Agent。", "每个设计列出 5 个失败模式及检测方法。"]}, "output": {"en": "Two design sketches with trade-offs.", "zh": "两份带取舍说明的设计草图。"}}, {"week": "15", "phase": "interview", "hours": "10", "title": {"en": "Mock interviews", "zh": "模拟面试"}, "goal": {"en": "Perform under realistic conditions.", "zh": "在接近真实的条件下发挥。"}, "steps": {"en": ["3 mocks: 15 min project, 25 min design, 20 min rapid-fire (Shuffle + starred).", "Live-code the agent loop, RRF, metrics, retry.", "Redo the three weakest answers next day."], "zh": ["3 次模拟：15 分钟项目、25 分钟设计、20 分钟快问快答（随机 + 仅星标）。", "现场手写 Agent 循环、RRF、指标、重试。", "第二天重做最弱的三个回答。"]}, "output": {"en": "A list of weak spots, each fixed.", "zh": "弱项清单，并逐一补强。"}}, {"week": "16", "phase": "interview", "hours": "6–8", "title": {"en": "Polish", "zh": "收尾打磨"}, "goal": {"en": "Everything works for a live demo; you're rested.", "zh": "现场演示一切正常；保持状态。"}, "steps": {"en": ["Re-run all tests and demos.", "Glossary pass: every term under 20 seconds.", "Prepare questions for the interviewer; rest the day before."], "zh": ["重新运行所有测试和演示。", "过一遍术语表：每个术语 20 秒内讲清。", "准备向面试官提的问题；面试前一天休息。"]}, "output": {"en": "Ready.", "zh": "准备就绪。"}}], "phases": {"setup": {"en": "Setup", "zh": "准备"}, "platform": {"en": "RAG platform", "zh": "RAG 平台"}, "knowledge": {"en": "Knowledge engineering", "zh": "知识工程"}, "trust": {"en": "Trust & quality", "zh": "可信与质量"}, "agent": {"en": "Agents", "zh": "Agent"}, "models": {"en": "Models & ecosystem", "zh": "模型与生态"}, "interview": {"en": "Interview", "zh": "面试"}}, "project": {"pitch": {"en": ["I built a learning-scale enterprise knowledge and agent platform in Python and FastAPI. Documents are parsed, chunked and indexed twice: in Elasticsearch for BM25 and in Qdrant for embeddings. Queries go through optional query rewriting, parallel keyword and vector retrieval, Reciprocal Rank Fusion and a local LLM reranker, and answers carry numbered citations with document version and source. Around that there's a governance lifecycle, ACL enforced at retrieval time, a Neo4j GraphRAG path, entity resolution, and an evaluation service that scores retrieval and generation separately.", "On top, I built the agent twice, on purpose: first framework-free, with schema-validated actions, budgets, human approval and idempotent writes; then as a LangGraph state graph with one model-driven planning node, deterministic verification, a checkpointed approval pause and an execution ledger. I kill the process right after the write, resume, and prove from the ledger that nothing was duplicated. Knowledge search is also a read-only MCP server. I evaluate the agent with 21 golden and adversarial tasks over repeated trials, reporting pass@1, pass^k and an unapproved-writes invariant that must stay at zero."], "zh": ["我用 Python 和 FastAPI 做了一个学习规模的企业知识与 Agent 平台。文档经过解析、分块，并被索引两次：Elasticsearch 做 BM25，Qdrant 存 embedding。查询经过可选的查询改写、并行的关键词和向量检索、倒数排名融合（RRF）以及本地 LLM 重排序，答案附带编号引用，包含文档版本和来源。外围有治理生命周期、在检索时执行的 ACL、Neo4j GraphRAG、实体消歧，以及分别评估检索和生成的评估服务。", "在此之上，我有意把 Agent 做了两遍：第一遍不用框架，包含 schema 校验的动作、预算、人工审批和幂等写入；第二遍用 LangGraph 状态图，只有一个由模型驱动的规划节点，加上确定性校验、带 checkpoint 的审批暂停和执行账本。我在写入后立即杀掉进程，再恢复，用账本证明没有重复写入。知识检索也作为只读 MCP server 暴露。我用 21 个 golden 和对抗性任务、多次重复来评估 Agent，报告 pass@1、pass^k 以及必须保持为 0 的“未审批写入”指标。"]}, "labs": [{"lab": "1–2", "title": {"en": "Knowledge API + BM25", "zh": "知识 API + BM25"}, "proof": "pytest -q · GET /search", "files": "api/ · services/knowledge.py · retrieval/elasticsearch_index.py"}, {"lab": "3", "title": {"en": "Vector RAG with citations", "zh": "带引用的向量 RAG"}, "proof": "POST /rag/query", "files": "ingestion/chunking.py · services/rag.py"}, {"lab": "4", "title": {"en": "Hybrid + RRF + rerank + metrics", "zh": "混合检索 + RRF + 重排序 + 指标"}, "proof": "eval/run_eval.py", "files": "retrieval/fusion.py · services/hybrid.py · evaluation/metrics.py"}, {"lab": "5–6", "title": {"en": "Ontology + GraphRAG", "zh": "本体 + GraphRAG"}, "proof": "POST /graph/compare", "files": "dto/graph.py · services/graph.py"}, {"lab": "7", "title": {"en": "Entity resolution, duplicates, contradictions", "zh": "实体消歧、近重复、矛盾检测"}, "proof": "POST /refinement/entities/resolve", "files": "refinement/entity_resolution.py"}, {"lab": "8", "title": {"en": "Governance, provenance, rollback", "zh": "治理、溯源、回滚"}, "proof": "POST /governance/documents/{id}/transition", "files": "services/governance.py"}, {"lab": "9–10", "title": {"en": "Evaluation, observability, security", "zh": "评估、可观测性、安全"}, "proof": "POST /evaluation/run · /observability/summary", "files": "services/evaluation.py · observability.py · security.py"}, {"lab": "11", "title": {"en": "Framework-free agent + upgrades", "zh": "无框架 Agent + 升级"}, "proof": "POST /agent/runs · eval/run_agent.py", "files": "agent/runtime.py · agent/memory.py"}, {"lab": "12", "title": {"en": "Durable LangGraph agent + MCP + eval suite", "zh": "持久化 LangGraph Agent + MCP + 评估套件"}, "proof": "scripts/lab12_crash_demo.py → PASS · eval/run_agent_suite.py", "files": "agent/graph_runtime.py · mcp_server.py · evaluation/agent_metrics.py"}], "stories": [{"en": "The model guessed instead of calculating. → required_tools narrows the schema to the next required tool. Enforce critical steps in code.", "zh": "模型没算就猜了答案。→ required_tools 把 schema 收窄为下一个必需工具。关键步骤要用代码强制。"}, {"en": "Retrieval was perfect (Recall@3 = 1.0) but citation accuracy was 0.5. → Evaluate retrieval and generation separately.", "zh": "检索完美（Recall@3 = 1.0），但引用准确率只有 0.5。→ 检索和生成要分开评估。"}, {"en": "Double approval. → Idempotency key + ON CONFLICT DO NOTHING turns the second approval into a read.", "zh": "重复审批。→ 幂等键 + ON CONFLICT DO NOTHING 让第二次审批变成只读。"}, {"en": "The schema that broke the model server: Ollama couldn't compile maxLength 2000 plus nested nullable objects into a grammar. → Bisected, flattened, made every field required, added a regression test.", "zh": "让模型服务报错的 schema：Ollama 无法把 maxLength 2000 和嵌套可空对象编译成语法。→ 二分排查、扁平化、所有字段设为必填，并加回归测试。"}, {"en": "My own prompt refactor broke the agent: 'return tool=finish' became 'finish', and llama3 looped on calculate. Unit tests passed; the live eval suite caught it. → Restored the wording, 15/15 on re-run, pinned in a test. Prompts are code.", "zh": "我自己的 prompt 重构把 Agent 弄坏了：“return tool=finish”被改成“finish”，llama3 就一直循环调用 calculate。单元测试全过，是线上评估套件发现的。→ 恢复原措辞，重跑 15/15 通过，并用测试锁定。Prompt 就是代码。"}, {"en": "Crash after the write. → LangGraph re-runs the unfinished node; the ledger check returns the existing receipt instead of writing again.", "zh": "写入后崩溃。→ LangGraph 会重跑未完成的节点；账本检查返回已有回执，而不是再写一次。"}]}};

const store = {
  get(key, fallback) { try { const v = localStorage.getItem("ragAgentLab." + key); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(key, value) { try { localStorage.setItem("ragAgentLab." + key, JSON.stringify(value)); } catch (e) { /* storage unavailable: keep in memory */ } }
};

const TABS = ["questions", "cards", "plan", "glossary", "project"];
const state = {
  lang: store.get("lang", "en"),
  tab: TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get("tab", "questions"),
  marks: store.get("marks", {}),
  weeks: store.get("weeks", {}),
  q: { search: "", section: "all", starred: false, status: "all" },
  deck: { section: "all", starred: false, order: "due", queue: [], index: 0, shown: false },
  gloss: { search: "", group: "all" }
};

const main = document.getElementById("main");
const t = () => UI[state.lang];
const el = (tag, attrs = {}, ...children) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") node.className = v;
    else if (k === "html") node.innerHTML = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else if (v !== false && v !== null && v !== undefined) node.setAttribute(k, v === true ? "" : v);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined) node.append(child.nodeType ? child : document.createTextNode(child));
  return node;
};
const plain = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent || ""; };
const sectionName = (id) => { const s = DATA.sections.find(x => x.id === id); return s ? s[state.lang] : id; };
const qText = (q) => state.lang === "zh" ? q.q_zh : q.q_en;
const aHtml = (q) => state.lang === "zh" ? q.a_zh : q.a_en;
const markOf = (id) => state.marks[id] || null;

function setMark(id, value) {
  if (value) state.marks[id] = value; else delete state.marks[id];
  store.set("marks", state.marks);
}

function matches(q, f) {
  if (f.section !== "all" && q.section !== f.section) return false;
  if (f.starred && !q.star) return false;
  if (f.status && f.status !== "all") {
    const m = markOf(q.id);
    if (f.status === "new" && m) return false;
    if (f.status !== "new" && m !== f.status) return false;
  }
  if (f.search) {
    const needle = f.search.toLowerCase();
    const hay = (q.id + " " + q.q_en + " " + q.q_zh + " " + plain(q.a_en) + " " + plain(q.a_zh)).toLowerCase();
    if (!hay.includes(needle)) return false;
  }
  return true;
}

function meter() {
  const total = DATA.questions.length;
  const known = DATA.questions.filter(q => markOf(q.id) === "known").length;
  const review = DATA.questions.filter(q => markOf(q.id) === "review").length;
  return el("div", { class: "meter" },
    el("div", { class: "meter-row" },
      el("span", {}, t().known + " ", el("strong", {}, `${known}`), ` ${t().of} ${total}`),
      el("span", {}, t().review + " ", el("strong", {}, `${review}`)),
      el("span", {}, t().untouched + " ", el("strong", {}, `${total - known - review}`))),
    el("div", { class: "bar", role: "img", "aria-label": `${known} known, ${review} to review, of ${total}` },
      el("i", { class: "k", style: `width:${known / total * 100}%` }),
      el("i", { class: "r", style: `width:${review / total * 100}%` })));
}

function sectionChips(filter, onPick) {
  const counts = {};
  DATA.questions.forEach(q => { counts[q.section] = (counts[q.section] || 0) + 1; });
  const row = el("div", { class: "chip-row", role: "group", "aria-label": "Sections" });
  row.append(el("button", { type: "button", class: "chip", "aria-pressed": String(filter.section === "all"), onclick: () => onPick("all") }, t().all));
  DATA.sections.forEach(s => row.append(el("button", { type: "button", class: "chip", "aria-pressed": String(filter.section === s.id), onclick: () => onPick(s.id) },
    `${s.id} · ${s[state.lang]}`, el("span", { class: "n" }, String(counts[s.id] || 0)))));
  return row;
}

function markButtons(q, after) {
  const m = markOf(q.id);
  return el("div", { class: "actions" },
    el("button", { type: "button", class: "btn good", "aria-pressed": String(m === "known"), onclick: () => { setMark(q.id, m === "known" ? null : "known"); after(); } }, t().knowIt),
    el("button", { type: "button", class: "btn rev", "aria-pressed": String(m === "review"), onclick: () => { setMark(q.id, m === "review" ? null : "review"); after(); } }, t().reviewAgain));
}

function stateBadge(q) {
  const m = markOf(q.id);
  return m ? el("span", { class: "state " + m }, m === "known" ? t().known : t().review) : el("span");
}

function renderQuestions() {
  const f = state.q;
  const open = new Set([...main.querySelectorAll("details.q[open]")].map(d => d.dataset.id));
  // First visit to this tab: show one answer so the page demonstrates itself.
  if (!main.querySelector("details.q") && !open.size) open.add(DATA.questions[0].id);
  const panel = el("section", { class: "panel", id: "panel-questions" });
  panel.append(el("p", { class: "lede" }, t().qLede), meter());
  const search = el("input", { type: "search", id: "q-search", placeholder: t().search, value: f.search, "aria-label": t().search });
  search.addEventListener("input", () => { f.search = search.value; drawList(); });
  const status = el("select", { id: "q-status", "aria-label": "Status" },
    ...[["all", t().statusAll], ["new", t().statusNew], ["review", t().statusReview], ["known", t().statusKnown]]
      .map(([v, label]) => el("option", { value: v, selected: f.status === v }, label)));
  status.addEventListener("change", () => { f.status = status.value; drawList(); });
  const starred = el("button", { type: "button", class: "chip", "aria-pressed": String(f.starred), onclick: () => { f.starred = !f.starred; render(); } }, t().starred);
  panel.append(el("div", { class: "toolbar" }, search, status, starred));
  panel.append(sectionChips(f, (id) => { f.section = id; render(); }));
  const list = el("div", { class: "qlist", id: "qlist" });
  panel.append(list);
  function drawList() {
    list.replaceChildren();
    const items = DATA.questions.filter(q => matches(q, f));
    if (!items.length) { list.append(el("div", { class: "empty" }, t().none)); return; }
    items.forEach(q => {
      const d = el("details", { class: "q", "data-id": q.id, open: open.has(q.id) });
      const redraw = () => { d.querySelector("summary").replaceWith(summary()); d.querySelector(".actions").replaceWith(markButtons(q, redraw)); refreshMeter(); };
      const summary = () => el("summary", {},
        el("span", { class: "qid" }, q.id),
        el("span", { class: "qtext" }, q.star ? el("span", { class: "star", "aria-label": "starred" }, "★") : null, qText(q)),
        stateBadge(q));
      d.append(summary(), el("div", { class: "answer" }, el("div", { html: aHtml(q) }), markButtons(q, redraw)));
      list.append(d);
    });
  }
  function refreshMeter() { panel.querySelector(".meter").replaceWith(meter()); }
  drawList();
  return panel;
}

function buildDeck() {
  const d = state.deck;
  let items = DATA.questions.filter(q => matches(q, { section: d.section, starred: d.starred, status: "all", search: "" }));
  if (d.order === "shuffle") {
    items = items.slice();
    for (let i = items.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [items[i], items[j]] = [items[j], items[i]]; }
  } else {
    const rank = (q) => ({ review: 0, undefined: 1, known: 2 })[markOf(q.id) || "undefined"];
    items = items.slice().sort((a, b) => rank(a) - rank(b));
  }
  d.queue = items.map(q => q.id); d.index = 0; d.shown = false;
}

function renderCards() {
  const d = state.deck;
  if (!d.queue.length) buildDeck();
  const panel = el("section", { class: "panel", id: "panel-cards" });
  panel.append(el("p", { class: "lede" }, t().cardLede));
  const order = el("select", { id: "deck-order", "aria-label": t().deck },
    el("option", { value: "due", selected: d.order === "due" }, t().dueFirst),
    el("option", { value: "shuffle", selected: d.order === "shuffle" }, t().shuffle));
  order.addEventListener("change", () => { d.order = order.value; buildDeck(); render(); });
  const starred = el("button", { type: "button", class: "chip", "aria-pressed": String(d.starred), onclick: () => { d.starred = !d.starred; buildDeck(); render(); } }, t().starred);
  panel.append(el("div", { class: "toolbar" }, order, starred));
  panel.append(sectionChips(d, (id) => { d.section = id; buildDeck(); render(); }));
  if (!d.queue.length) { panel.append(el("div", { class: "empty" }, t().deckEmpty)); return panel; }
  const q = DATA.questions.find(x => x.id === d.queue[d.index % d.queue.length]);
  const card = el("article", { class: "card", "aria-live": "polite" },
    el("div", { class: "meta" }, el("span", {}, `${(d.index % d.queue.length) + 1} / ${d.queue.length}`), el("span", {}, `${q.id} · ${sectionName(q.section)}`),
      q.star ? el("span", { class: "star" }, "★") : null, stateBadge(q)),
    el("div", { class: "front" }, qText(q)));
  if (d.shown) {
    card.append(el("div", { class: "answer", html: aHtml(q) }));
    card.append(el("div", { class: "actions" },
      el("button", { type: "button", class: "btn good", onclick: () => grade("known") }, t().knowIt, " ", el("span", { class: "kbd" }, "K")),
      el("button", { type: "button", class: "btn rev", onclick: () => grade("review") }, t().reviewAgain, " ", el("span", { class: "kbd" }, "R")),
      el("button", { type: "button", class: "btn", onclick: nextCard }, t().next, " ", el("span", { class: "kbd" }, "→"))));
  } else {
    card.append(el("div", { class: "actions" },
      el("button", { type: "button", class: "btn primary", id: "show-answer", onclick: () => { d.shown = true; render(); } }, t().showAnswer, " ", el("span", { class: "kbd" }, "Space")),
      el("button", { type: "button", class: "btn", onclick: nextCard }, t().next, " ", el("span", { class: "kbd" }, "→"))));
  }
  panel.append(card, el("p", { class: "small" }, t().storage));
  return panel;
}

function grade(value) {
  const d = state.deck;
  setMark(d.queue[d.index % d.queue.length], value);
  nextCard();
}
function nextCard() { const d = state.deck; d.index = (d.index + 1) % Math.max(1, d.queue.length); d.shown = false; render(); }

document.addEventListener("keydown", (e) => {
  if (state.tab !== "cards" || e.target.closest("input, select, textarea")) return;
  if (e.key === " ") { e.preventDefault(); state.deck.shown = true; render(); }
  else if (e.key === "ArrowRight") nextCard();
  else if ((e.key === "k" || e.key === "K") && state.deck.shown) grade("known");
  else if ((e.key === "r" || e.key === "R") && state.deck.shown) grade("review");
});

function renderPlan() {
  const panel = el("section", { class: "panel", id: "panel-plan" });
  panel.append(el("p", { class: "lede" }, t().planLede));
  const plan = el("div", { class: "plan" });
  const order = [];
  DATA.plan.forEach(w => { if (!order.includes(w.phase)) order.push(w.phase); });
  order.forEach(phase => {
    const weeks = el("div", { class: "weeks" });
    DATA.plan.filter(w => w.phase === phase).forEach(w => {
      const done = !!state.weeks[w.week];
      const box = el("input", { type: "checkbox", id: "week-" + w.week, checked: done });
      box.addEventListener("change", () => { state.weeks[w.week] = box.checked; store.set("weeks", state.weeks); row.classList.toggle("done", box.checked); });
      const row = el("div", { class: "week" + (done ? " done" : "") },
        el("div", { class: "wk" }, el("b", {}, w.week), el("span", {}, `${w.hours} ${t().hours}`),
          el("label", { class: "done-toggle", for: "week-" + w.week }, box, t().done)),
        el("div", {},
          el("h4", {}, w.title[state.lang]),
          el("p", { class: "goal" }, w.goal[state.lang]),
          el("ol", {}, ...w.steps[state.lang].map(s => el("li", {}, s))),
          el("div", { class: "out" }, el("span", {}, t().output), w.output[state.lang])));
      weeks.append(row);
    });
    plan.append(el("div", { class: "phase" }, el("h3", {}, DATA.phases[phase][state.lang]), weeks));
  });
  panel.append(plan);
  return panel;
}

function renderGlossary() {
  const g = state.gloss;
  const panel = el("section", { class: "panel", id: "panel-glossary" });
  panel.append(el("p", { class: "lede" }, t().glossLede));
  const search = el("input", { type: "search", id: "gloss-search", placeholder: t().glossSearch, value: g.search, "aria-label": t().glossSearch });
  search.addEventListener("input", () => { g.search = search.value; drawRows(); });
  const group = el("select", { id: "gloss-group", "aria-label": "Group" },
    el("option", { value: "all" }, t().all),
    ...DATA.groups.map(x => el("option", { value: x.en, selected: g.group === x.en }, x[state.lang])));
  group.addEventListener("change", () => { g.group = group.value; drawRows(); });
  panel.append(el("div", { class: "toolbar" }, search, group));
  const tbody = el("tbody");
  panel.append(el("div", { class: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, t().term), el("th", {}, t().meaning), el("th", {}, t().repo))), tbody)));
  function drawRows() {
    tbody.replaceChildren();
    const needle = g.search.toLowerCase();
    DATA.glossary.filter(r => (g.group === "all" || r.group === g.group) &&
      (!needle || (r.term + " " + r.term_zh + " " + plain(r.en) + " " + plain(r.zh)).toLowerCase().includes(needle)))
      .forEach(r => tbody.append(el("tr", {},
        el("td", { class: "term" }, r.term, r.term_zh ? el("small", {}, r.term_zh) : null),
        el("td", { html: state.lang === "zh" ? r.zh : r.en }),
        el("td", { class: "repo", html: r.repo }))));
  }
  drawRows();
  return panel;
}

function renderProject() {
  const p = DATA.project;
  const panel = el("section", { class: "panel", id: "panel-project" });
  panel.append(el("h2", {}, t().pitchTitle), el("div", { class: "pitch" }, ...p.pitch[state.lang].map(x => el("p", {}, x))));
  panel.append(el("h2", {}, t().labsTitle));
  panel.append(el("div", { class: "table-wrap" }, el("table", {},
    el("thead", {}, el("tr", {}, el("th", {}, t().lab), el("th", {}, t().topic), el("th", {}, t().proof), el("th", {}, t().files))),
    el("tbody", {}, ...p.labs.map(l => el("tr", {},
      el("td", { class: "repo" }, l.lab), el("td", {}, l.title[state.lang]),
      el("td", { class: "repo" }, l.proof), el("td", { class: "repo" }, l.files)))))));
  panel.append(el("h2", {}, t().storiesTitle));
  panel.append(el("ul", { class: "stories" }, ...p.stories.map(s => el("li", { class: "story" }, s[state.lang]))));
  return panel;
}

const RENDER = { questions: renderQuestions, cards: renderCards, plan: renderPlan, glossary: renderGlossary, project: renderProject };

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.replaceChildren(...TABS.map(id => el("button", {
    type: "button", role: "tab", id: "tab-" + id, "aria-selected": String(state.tab === id), "aria-controls": "panel-" + id,
    onclick: () => { state.tab = id; store.set("tab", id); history.replaceState(null, "", "#" + id); render(); window.scrollTo({ top: 0 }); }
  }, t().tabs[id])));
}

function render() {
  document.documentElement.lang = state.lang === "zh" ? "zh-CN" : "en";
  document.getElementById("subtitle").textContent = t().subtitle;
  document.getElementById("lang-en").setAttribute("aria-pressed", String(state.lang === "en"));
  document.getElementById("lang-zh").setAttribute("aria-pressed", String(state.lang === "zh"));
  renderTabs();
  main.replaceChildren(RENDER[state.tab]());
}

function setLang(lang) { state.lang = lang; store.set("lang", lang); render(); }
document.getElementById("lang-en").addEventListener("click", () => setLang("en"));
document.getElementById("lang-zh").addEventListener("click", () => setLang("zh"));
render();
</script>
